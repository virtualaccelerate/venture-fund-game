<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Фонд на 10 лет · Venture School</title>
<meta name="description" content="Игра Venture School: создайте фонд, сформулируйте тезис, соберите портфель стартапов и посчитайте TVPI, DPI и net TVPI.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}
:root{--bg:#F4F6FB;--surface:#FFFFFF;--soft:#F0F3FA;--ink:#172033;--muted:#5E6A82;--line:#E1E6F0;--accent:#2563EB;--accent-soft:#E6EEFF;--accent-ink:#FFFFFF;--good:#12805C;--good-bg:#E4F6EE;--bad:#C23A2E;--bad-bg:#FDECEA;--warn:#9A5B00;--warn-bg:#FFF4DE;--c-ceo:#FF7A59;--c-cto:#F2B705;--c-pool:#9B6BF2;--c-inv:#2563EB;--c-seed:#16B3A3;--font:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0F1422;--surface:#171E30;--soft:#1F2840;--ink:#E8ECF6;--muted:#9AA5BE;--line:#2A3452;--accent:#6C9BFF;--accent-soft:#1E2C52;--accent-ink:#0F1422;--good:#45D69C;--good-bg:#14302A;--bad:#FF8577;--bad-bg:#3A1E1E;--warn:#FFC266;--warn-bg:#3A2D14;--c-inv:#6C9BFF;color-scheme:dark}
}
:root[data-theme=dark]{--bg:#0F1422;--surface:#171E30;--soft:#1F2840;--ink:#E8ECF6;--muted:#9AA5BE;--line:#2A3452;--accent:#6C9BFF;--accent-soft:#1E2C52;--accent-ink:#0F1422;--good:#45D69C;--good-bg:#14302A;--bad:#FF8577;--bad-bg:#3A1E1E;--warn:#FFC266;--warn-bg:#3A2D14;--c-inv:#6C9BFF;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:grid;gap:2px}
.brand small{font-size:13px;color:var(--muted);font-weight:500}
h1{font-size:clamp(22px,3.6vw,32px);font-weight:800;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
.score{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px;font-weight:600}
.score .dot{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:15px}
.score b{font-family:var(--mono);color:var(--accent)}
.stages{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.stages span{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--muted)}
.stages span i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-size:12px;font-family:var(--mono)}
.stages span.now{border-color:var(--accent);color:var(--ink)}
.stages span.now i{background:var(--accent);color:var(--accent-ink)}
.stages span.done i{background:var(--good);color:var(--surface)}
.board{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
@media (max-width:900px){.board{grid-template-columns:minmax(0,1fr)}
}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(18px,3vw,30px);min-width:0;display:grid;gap:20px}
.stage h2{font-size:clamp(20px,2.6vw,26px);font-weight:800;line-height:1.2;margin:0;text-wrap:balance}
.intro{display:grid;gap:10px}
.block p,.intro p{margin:0;max-width:64ch}
.muted{color:var(--muted)}
.hint{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:15px}
.hint::before{content:"i";flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px;font-family:var(--mono)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.facts div{background:var(--soft);border-radius:12px;padding:12px 14px;display:grid;gap:2px}
.facts span{font-size:13px;color:var(--muted)}
.facts b{font-family:var(--mono);font-size:19px;font-weight:600}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
td,th{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--soft);font-size:13px;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--mono);text-align:right}
th.num{text-align:right}
td.q{color:var(--accent);font-weight:700}
.block{border-top:1px dashed var(--line);padding-top:18px;display:grid;gap:10px}
.block h3{font-size:18px;font-weight:700;margin:0;line-height:1.3;text-wrap:balance}
.tag{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
.options{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
button{font:inherit;color:inherit;cursor:pointer}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:4px;align-content:start;min-height:56px;transition:border-color .15s,background .15s,transform .15s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px)}
.btn:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt:disabled{cursor:default}
.opt .n{font-family:var(--mono);font-size:20px;font-weight:600}
.opt .t{font-weight:600}
.opt .s{font-size:14px;color:var(--muted)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.dim{opacity:.45}
.fb{border-radius:12px;padding:12px 16px;background:var(--soft);display:grid;gap:4px}
.fb.good{background:var(--good-bg)}
.fb.bad{background:var(--bad-bg)}
.fb.warn{background:var(--warn-bg)}
.fb strong{font-weight:700}
.fb.good strong{color:var(--good)}
.fb.bad strong{color:var(--bad)}
.fb.warn strong{color:var(--warn)}
.formula{font-family:var(--mono);font-size:13px;opacity:.85;overflow-x:auto;white-space:nowrap}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:13px 24px;font-weight:700;font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.slider{background:var(--soft);border-radius:14px;padding:16px;display:grid;gap:10px}
.slider input{width:100%;accent-color:var(--accent)}
.slider .out{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center}
.slider .big{font-family:var(--mono);font-size:28px;font-weight:600}
.zone{font-size:14px;font-weight:600;padding:3px 10px;border-radius:999px}
.zone.ok{background:var(--good-bg);color:var(--good)}
.zone.lo{background:var(--warn-bg);color:var(--warn)}
.zone.hi{background:var(--bad-bg);color:var(--bad)}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-family:var(--mono)}
.neg{display:grid;gap:14px}
.scoreboard{display:grid;grid-template-columns:1fr 1fr auto;gap:10px}
@media (max-width:520px){.scoreboard{grid-template-columns:1fr 1fr}
.scoreboard .trust{grid-column:1/-1}
}
.scoreboard .sb{background:var(--soft);border-radius:12px;padding:10px 14px;display:grid;gap:4px;align-content:start}
.scoreboard span{font-size:13px;color:var(--muted)}
.scoreboard b{font-family:var(--mono);font-size:20px;font-weight:600}
.scoreboard .trust{min-width:150px}
.meter{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:6px}
.meter .fill{height:100%;border-radius:999px;transition:width .4s,background .4s}
.meter .fill.hi{background:var(--good)}
.meter .fill.mid{background:var(--warn)}
.meter .fill.lo{background:var(--bad)}
.tlabel{font-style:normal;font-size:13px;font-weight:600}
.sys{justify-self:center;text-align:center;font-size:13px;color:var(--warn);background:var(--warn-bg);border-radius:999px;padding:6px 14px;max-width:95%}
.chat{display:grid;gap:10px;background:var(--soft);border-radius:16px;padding:14px;max-height:420px;overflow-y:auto}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:88%}
.msg .av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--surface)}
.msg .bub{background:var(--surface);border-radius:14px 14px 14px 4px;padding:10px 14px;font-size:15px}
.msg.me{margin-left:auto;flex-direction:row-reverse}
.msg.me .bub{background:var(--accent);color:var(--accent-ink);border-radius:14px 14px 4px 14px}
.msg .who{display:block;font-size:12px;font-weight:700;opacity:.7;margin-bottom:2px}
.moves{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.side{display:grid;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
@media (max-width:900px){.side{position:static;order:-1}
}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:12px}
.panel h3{margin:0;font-size:15px;font-weight:700}
.donut{display:flex;align-items:center;gap:14px}
.donut svg{width:110px;height:110px;flex:none}
.val{display:grid;gap:2px;font-size:13px}
.val span{color:var(--muted)}
.val b{font-family:var(--mono);font-weight:600;font-size:17px}
.legend{display:grid;gap:8px;font-size:14px;font-variant-numeric:tabular-nums}
.legend div{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center}
.legend div.me{font-weight:700}
.legend i{width:12px;height:12px;border-radius:4px;display:block}
.legend .pc{font-family:var(--mono)}
.pos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pos div{background:var(--soft);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.pos span{font-size:12px;color:var(--muted)}
.pos b{font-family:var(--mono);font-weight:600;font-size:17px}
.final{display:grid;gap:14px}
.final .big{font-size:clamp(44px,8vw,72px);font-weight:800;line-height:1;font-family:var(--mono);color:var(--accent)}
.final h3{margin:0;font-size:18px}
ul.lessons{margin:0;padding-left:20px;display:grid;gap:6px;max-width:64ch}
.dicewrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.die{width:96px;height:96px;border-radius:22px;background:var(--surface);border:2px solid var(--line);box-shadow:0 6px 0 var(--line);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:14px;gap:6px}
.die i{border-radius:50%}
.die i.on{background:var(--ink)}
.die.spin{animation:wob .12s ease-in-out}
.die.land{animation:pop .4s ease-out;border-color:var(--accent)}
@keyframes wob{0%{transform:rotate(-14deg) translateY(-8px)}
100%{transform:rotate(14deg) translateY(0)}
}
@keyframes pop{0%{transform:scale(1.25) rotate(-8deg)}
100%{transform:scale(1) rotate(0)}
}
.result{border-radius:14px;padding:14px 16px;display:grid;gap:4px}
.result h3{margin:0}
.result p{margin:0}
.result.good{background:var(--good-bg)}
.result.warn{background:var(--warn-bg)}
.result.bad{background:var(--bad-bg)}
tr.cur td{background:var(--accent-soft);font-weight:700}
.summary{border:2px solid var(--accent);border-radius:20px;padding:clamp(16px,3vw,24px);display:grid;gap:16px;background:var(--surface)}
.summary .top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.summary .lvl{display:grid;gap:2px}
.summary .lvl span{color:var(--muted);font-size:14px}
.summary .lvl b{font-size:22px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}
}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.co{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:8px;align-content:start;transition:border-color .15s,background .15s,transform .15s}
.co:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.co:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.co.sel{border-color:var(--accent);background:var(--accent-soft)}
.co:disabled{cursor:default;opacity:.5}
.co .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.co .nm{font-weight:800;font-size:17px;line-height:1.2}
.co .sc{font-size:13px;color:var(--muted)}
.co .pt{font-size:14px;line-height:1.4}
.co .chk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--accent-ink)}
.co.sel .chk{background:var(--accent);border-color:var(--accent)}
.sig{display:flex;flex-wrap:wrap;gap:6px}
.sig span{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px}
.l3{background:var(--good-bg);color:var(--good)}
.l2{background:var(--warn-bg);color:var(--warn)}
.l1{background:var(--bad-bg);color:var(--bad)}
.co .rk{font-size:13px;color:var(--muted)}
.co .pr{display:flex;justify-content:space-between;font-size:13px;border-top:1px dashed var(--line);padding-top:8px}
.co .pr b{font-family:var(--mono)}
.picker{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:5;background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;box-shadow:0 8px 24px rgba(20,30,60,.12)}
.picker b{font-family:var(--mono)}
.btn:disabled{opacity:.45;cursor:default}
.strats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.strat{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:8px;align-content:start;transition:border-color .15s,background .15s}
.strat:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.strat:disabled{cursor:default}
.strat.picked{border-color:var(--accent);background:var(--accent-soft)}
.strat.dim{opacity:.45}
.strat .t{font-weight:800;font-size:18px}
.strat .s{font-size:14px;color:var(--muted)}
.split{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--line)}
.split i{display:block;height:100%}
.split .a{background:var(--accent)}
.split .r{background:var(--c-pool)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.kv span{color:var(--muted)}
.kv b{font-family:var(--mono);text-align:right}
.yrbox{display:grid;gap:12px}
.plist{display:grid;gap:8px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;background:var(--soft);border-radius:12px;padding:10px 12px;transition:background .3s}
.prow .nm{font-weight:700}
.prow .nw{grid-column:1/-1;font-size:14px;color:var(--muted)}
.prow .vl{font-family:var(--mono);font-size:14px;text-align:right}
.prow.flash{animation:fl .6s ease-out}
@keyframes fl{0%{transform:scale(1.03)}
100%{transform:scale(1)}
}
.st{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st.alive,.st.flat{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.st.up{background:var(--good-bg);color:var(--good)}
.st.dead{background:var(--bad-bg);color:var(--bad)}
.st.exit,.st.sold{background:var(--accent-soft);color:var(--accent)}
.st.huge{background:var(--good);color:var(--surface)}
.fo{display:grid;gap:10px}
.forow{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:8px}
.forow .top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline}
.forow .top b{font-size:16px}
.forow .row .opt{min-height:auto;padding:10px 14px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metrics div{background:var(--soft);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.metrics span{font-size:12px;color:var(--muted)}
.metrics b{font-family:var(--mono);font-weight:600;font-size:17px}
.metrics .wide{grid-column:1/-1}
.mini{display:grid;gap:6px;font-size:13px;max-height:320px;overflow-y:auto}
.mini div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.mini .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 140px;gap:10px;align-items:center;font-size:14px}
@media (max-width:520px){.bar{grid-template-columns:80px minmax(0,1fr) 112px;font-size:12px}
}
.bar .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{height:18px;background:var(--soft);border-radius:6px;position:relative;overflow:hidden}
.bar .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--accent)}
.bar .tr i.inv{background:var(--line);opacity:.9}
.bar .tr i.top{background:var(--good)}
.bar .vl{font-family:var(--mono);text-align:right}
.legend2{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend2 i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.formula-card{background:var(--soft);border-radius:12px;padding:12px 14px;display:grid;gap:6px;font-size:15px}
.formula-card code{font-family:var(--mono);font-size:14px;background:var(--surface);border-radius:6px;padding:2px 6px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
.segb{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.segb.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.segb:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mf{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mf div{background:var(--soft);border-radius:8px;padding:6px 8px;display:grid;gap:0}
.mf .w{grid-column:1/-1}
.mf span{font-size:11px;color:var(--muted)}
.mf b{font-size:14px;font-family:var(--mono);font-weight:600}
.co.sel .mf div{background:var(--surface)}
.test{border-radius:10px;padding:8px 10px;display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}
.test div{display:grid}
.test span{font-size:11px;color:var(--muted)}
.test b{font-family:var(--mono);font-size:14px}
.test em{grid-column:1/-1;font-style:normal;font-weight:700;font-size:13px}
.test.ok{background:var(--good-bg)}
.test.ok em{color:var(--good)}
.test.no{background:var(--bad-bg)}
.test.no em{color:var(--bad)}
.picker{flex-direction:row}
.pstats{display:grid;gap:4px;font-size:14px;min-width:0;flex:1}
.pstats .pl{display:flex;flex-wrap:wrap;gap:4px 14px}
.pstats b{font-family:var(--mono)}
.pstats .pw{font-size:13px;color:var(--warn);font-weight:600}
.review{display:grid;gap:8px}
.rv{background:var(--soft);border-radius:12px;padding:10px 14px;display:grid;gap:4px;font-size:15px}
